[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-api"
authors = [
  { name = "The Materials Project", email = "feedback@materialsproject.org" },
]
description = "API Client for the Materials Project"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause-LBNL"
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pymatgen==2026.5.4",
  "typing-extensions==4.15.0",
  "requests==2.33.1",
  "monty==2026.2.18",
  "emmet-core==0.86.4",
  "boto3==1.43.4",
  "orjson==3.11.9",
  "pyarrow==24.0.0",
  "deltalake==1.5.1",
  "httpx>=0.28.1",
  "polars>=1.40.1",
  "pydantic==2.13.4",
  "pint>=0.25.3",
  "annotated-types==0.7.0",
  "arro3-core==0.8.0",
  "bibtexparser==1.4.4",
  "blake3==1.0.8",
  "botocore==1.43.4",
  "certifi==2026.4.22",
  "charset-normalizer==3.4.7",
  "contourpy==1.3.3",
  "cycler==0.12.1",
  "deprecated==1.3.1",
  "fonttools==4.62.1",
  "idna==3.13",
  "inflect==7.5.0",
  "jmespath==1.1.0",
  "joblib==1.5.3",
  "kiwisolver==1.5.0",
  "latexcodec==3.0.1",
  "lxml==6.1.0",
  "matplotlib==3.10.9",
  "more-itertools==11.0.2",
  "mpmath==1.3.0",
  "narwhals==2.20.0",
  "networkx==3.6.1",
  "numpy==2.4.4",
  "packaging==26.2",
  "palettable==3.3.3",
  "pandas==3.0.2",
  "pillow==12.2.0",
  "plotly==6.7.0",
  "pubchempy==1.0.5",
  "pybtex==0.26.1",
  "pydantic-core==2.46.4",
  "pydantic-settings==2.14.0",
  "pymatgen-core==2026.4.16",
  "pymatgen-io-validation==0.1.2",
  "pyparsing==3.3.2",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.2",
  "pyyaml==6.0.3",
  "ruamel-yaml==0.19.1",
  "s3transfer==0.17.0",
  "scipy==1.17.1",
  "six==1.17.0",
  "spglib==2.7.0",
  "sympy==1.14.0",
  "tabulate==0.10.0",
  "tqdm==4.67.3",
  "typeguard==4.5.1",
  "typing-inspection==0.4.2",
  "uncertainties==3.2.3",
  "urllib3==2.6.3",
  "wrapt==2.1.2",
  "boltons>=25.0.0",
  "filetype>=1.2.0",
  "ipython>=9.13.0",
  "json2html>=1.3.0",
  "jsonschema>=4.26.0",
  "swagger-spec-validator>=3.0.4",
  "bravado>=12.0.1",
  "cachetools>=7.1.1",
  "pyisemail>=2.0.1",
  "requests-futures>=1.0.2",
]
dynamic = ["version"]

[project.optional-dependencies]
mcp = ["fastmcp"]
server = ["flask"]
contribs = [
  "boltons",
  "filetype",
  "ipython",
  "json2html",
  "pint>=0.25.0",
  "pyIsEmail",
  "requests-futures",
  "swagger-spec-validator",
  "cachetools",
]
all = [
  "custodian",
  "emmet-core[all]>=0.86.4rc1,<0.86.5",
  "fastmcp",
  "flask",
]
test = [
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "pytest-xdist",
  "flake8",
  "pycodestyle",
  "mypy",
  "mypy-extensions",
  "typing-extensions",
  "types-setuptools",
  "types-requests",
  "types-tqdm"
]
docs = ["sphinx"]

[project.scripts]
mpmcp = "mp_api.mcp.server:_run_mp_mcp_server"

[tool.setuptools.packages.find]
include = ["mp_api*"]
namespaces = true

[tool.setuptools_scm]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["default"]
log_cli_level = "info"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "PLE", # pylint error
  "PLW", # pylint warning
  "PYI", # flakes8-pyi
  "Q",   # flake8-quotes
  "SIM", # flake8-simplify
  "TID", # tidy imports
  "UP",  # pyupgrade
  "W",   # pycodestyle
  "YTT", # flake8-2020
]
ignore = [
  "B019",    # Use of functools.lru_cache or functools.cache on methods can lead to memory leaks
  "B028",    # No explicit stacklevel keyword argument found
  "B904",    # Within an except clause, raise exceptions with raise ... from err
  "D100",    # Missing docstring in public module
  "D104",    # Missing docstring in public package
  "D101",    # Missing docstring in public class
  "D102",    # Missing docstring in public method
  "D105",    # Missing docstring in magic method
  "D106",    # Missing docstring in public nested class
  "D205",    # 1 blank line required between summary line and description
  "PLW2901", # Outer for loop variable overwritten by inner assignment target
  "SIM105",  # Use contextlib.suppress(FileNotFoundError) instead of try-except-pass
  "SIM115",  # Use context handler for opening files,
  "E501",
]
exclude = ["docs", ".ruff_cache", "requirements", "test*", "settings.py"]
pydocstyle.convention = "google"
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"] # F401: imported but unused

[tool.mypy]
namespace_packages = true
ignore_missing_imports = true
follow_untyped_imports = true

[tool.coverage.report]
exclude_also = [
  # A pragma comment that excludes an entire file:
  '\A(?s:.*# pragma: exclude file.*)\Z',
]

[dependency-groups]
dev = [
    "tenacity>=9.1.4",
]
